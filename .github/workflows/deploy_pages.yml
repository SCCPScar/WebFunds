name: Deploy Web (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebFunds
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - run: >
          flutter build web --release --base-href /WebFunds/ --no-web-resources-cdn
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: WebFunds/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-weaver-function:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebFunds
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Weaver AI's Edge Function needs its own Supabase deploy credentials
      # (SUPABASE_ACCESS_TOKEN) and an ANTHROPIC_API_KEY, on top of the
      # SUPABASE_URL/SUPABASE_ANON_KEY the app build already uses. Until
      # those are added as repo secrets, this job skips instead of failing
      # — it never blocks the Pages deploy above, which is independent.
      - name: Check Weaver deploy credentials are configured
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Skipping: SUPABASE_ACCESS_TOKEN / ANTHROPIC_API_KEY / SUPABASE_URL not all set yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive Supabase project ref from SUPABASE_URL
        if: steps.check.outputs.ready == 'true'
        id: project
        run: echo "ref=$(echo "$SUPABASE_URL" | sed -E 's#https://##; s#\.supabase\.co.*##')" >> "$GITHUB_OUTPUT"

      - name: Deploy weaver-suggest-category
        if: steps.check.outputs.ready == 'true'
        run: >
          npx --yes supabase@latest functions deploy weaver-suggest-category
          --project-ref ${{ steps.project.outputs.ref }} --use-api

      - name: Set ANTHROPIC_API_KEY as a Supabase secret
        if: steps.check.outputs.ready == 'true'
        run: >
          npx --yes supabase@latest secrets set
          ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref ${{ steps.project.outputs.ref }}
